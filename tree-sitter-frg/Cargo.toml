[package]
name = "tree-sitter-frg"
description = "Frg grammar for tree-sitter"
version = "0.1.0"
authors = ["Shuflduf <shuflduf@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["frg", "incremental", "parsing", "tree-sitter"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/tree-sitter/tree-sitter-frg"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "/LICENSE",
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[dev-dependencies]
tree-sitter = "0.25.10"

[build-dependencies]
cc = "1.2"
